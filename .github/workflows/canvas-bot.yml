name: Canvas Telegram Bot

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: canvas-telegram-bot-state
  cancel-in-progress: false

jobs:
  check:
    # Nunca ejecutar una revisión con credenciales desde una rama alternativa.
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONUNBUFFERED: '1'
      PYTHONUTF8: '1'
      CANVAS_BASE_URL: ${{ secrets.CANVAS_BASE_URL }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      STATE_ENCRYPTION_KEY: ${{ secrets.STATE_ENCRYPTION_KEY }}
      CLASS_INVITE_CODE: ${{ secrets.CLASS_INVITE_CODE }}
      ALLOWED_TELEGRAM_USER_IDS: ${{ secrets.ALLOWED_TELEGRAM_USER_IDS }}
      TEST_MODE: 'true'
      STORAGE_BACKEND: remote
      DELIVERY_MODE: webhook
      STATE_API_URL: ${{ secrets.STATE_API_URL }}
      STATE_API_KEY: ${{ secrets.STATE_API_KEY }}
      TIMEZONE: Europe/Madrid
      MAX_USERS: '15'
      INITIAL_NOTIFICATIONS: 'false'
    steps:
      - name: Descargar código
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Preparar Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt
      - name: Revisar Canvas y guardar avisos en Cloudflare
        shell: bash
        run: |
          for attempt in 1 2 3; do
            status=0
            python -m src.main --once --sync-only || status=$?
            if [ "$status" -eq 0 ]; then exit 0; fi
            if [ "$status" -ne 75 ]; then exit "$status"; fi
            echo "Telegram actualizó el estado durante la revisión; recargando."
            sleep 5
          done
          exit 75
        # CAS en D1; se guarda ANTES/DESPUÉS de cada envío y tras cada alumno.
