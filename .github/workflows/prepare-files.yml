name: Preparar archivos para Canvas

on:
  schedule:
    - cron: '3-58/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: canvas-file-preparation
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Instalar optimizador sin pérdida
        run: python -m pip install -r requirements-compression.txt
      - name: Preparar documentos y avisar para confirmar
        env:
          PYTHONUNBUFFERED: '1'
          PYTHONUTF8: '1'
          CANVAS_BASE_URL: ${{ secrets.CANVAS_BASE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          STATE_ENCRYPTION_KEY: ${{ secrets.STATE_ENCRYPTION_KEY }}
          STATE_API_URL: ${{ secrets.STATE_API_URL }}
          STATE_API_KEY: ${{ secrets.STATE_API_KEY }}
          STORAGE_BACKEND: remote
          DELIVERY_MODE: webhook
          TEST_MODE: 'true'
        shell: bash
        run: |
          for attempt in 1 2 3; do
            status=0
            python -m src.compression_worker || status=$?
            if [ "$status" -eq 0 ]; then exit 0; fi
            if [ "$status" -ne 75 ]; then exit "$status"; fi
            echo "Telegram actualizó el estado; recargando la preparación."
            sleep 5
          done
          exit 75
        # Temporales privados en el runner; no se suben artefactos ni archivos al repositorio.
